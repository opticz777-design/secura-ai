<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASHA Worker Login | SynCura AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1A17;--saffron:#F4B63F;--teal:#0B4F4A;--paper:#F3F6F4;--line:#C9D3CF;--muted:#55635F}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Archivo,"Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink)}

.page{display:grid;grid-template-columns:minmax(360px,46fr) 54fr;min-height:100vh;min-height:100svh}

/* left: role panel */
.side{position:relative;background:var(--saffron);overflow:hidden;display:flex;flex-direction:column;
  padding:clamp(24px,3vw,44px);animation:wipe 1s cubic-bezier(.7,0,.2,1) both}
@keyframes wipe{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
.back{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;font-weight:700;font-size:17px;
  color:var(--ink);text-decoration:none;padding:8px 14px 8px 8px;border-radius:999px;border:2px solid transparent;
  transition:border-color .3s,background .3s;position:relative;z-index:2}
.back svg{width:28px;height:28px;padding:6px;border-radius:50%;background:var(--ink);transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.back svg path{fill:none;stroke:var(--saffron);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.back:hover{border-color:var(--ink)}
.back:hover svg{transform:translateX(-4px)}
.back:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.art{position:absolute;left:50%;top:50%;width:min(78%,520px);height:auto;overflow:visible;transform:translate(-50%,-58%)}
.art *{transform-box:fill-box;transform-origin:center}
.sun{animation:float 6s ease-in-out infinite}
.walker{animation:bob 1.1s ease-in-out infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -14px}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}

.role{margin-top:auto;position:relative;z-index:2}
.role h2{font-size:clamp(48px,6.4vw,104px);font-weight:850;font-stretch:68%;line-height:.9;letter-spacing:-.01em}
.role p{margin-top:12px;font-size:19px;font-weight:600}

/* right: form */
.main{display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,5vw,80px)}
.form-wrap{width:min(440px,100%);margin-inline:auto;animation:rise .8s cubic-bezier(.2,.8,.2,1) .5s both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:24px;letter-spacing:-.02em;font-stretch:90%}
.brand svg{width:42px;height:42px}
h1{margin-top:56px;font-size:clamp(40px,4.4vw,60px);font-weight:850;font-stretch:72%;line-height:.95}
.lead{margin-top:12px;font-size:18px;color:var(--muted);line-height:1.4}

form{margin-top:36px;display:grid;gap:24px}
.field label{display:block;margin-bottom:8px;font-size:16px;font-weight:700}
.control{position:relative}
.control input{width:100%;height:56px;padding:0 18px;font:inherit;font-size:17px;font-weight:500;color:var(--ink);
  background:#fff;border:2px solid var(--ink);border-radius:14px;outline:none;
  transition:transform .2s,box-shadow .2s,border-color .2s}
.control input::placeholder{color:#8A9692}
.control input:focus{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--teal);border-color:var(--teal)}
.control.pw input{padding-right:58px}
.eye{position:absolute;right:10px;top:50%;translate:0 -50%;width:38px;height:38px;border:0;border-radius:10px;background:transparent;
  display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:background .2s}
.eye:hover{background:#E6ECE9}
.eye:focus-visible{outline:3px solid var(--teal)}
.eye svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eye .off{display:none}.eye[aria-pressed="true"] .on{display:none}.eye[aria-pressed="true"] .off{display:block}

.submit{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:space-between;
  height:62px;padding:0 12px 0 26px;margin-top:6px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;
  color:#fff;background:var(--teal);border:2px solid var(--teal);border-radius:999px;transition:color .35s}
.submit::before{content:"";position:absolute;inset:0;background:var(--saffron);z-index:-1;transform:translateX(-101%);
  transition:transform .55s cubic-bezier(.7,0,.2,1)}
.submit:hover,.submit:focus-visible{color:var(--ink);border-color:var(--ink)}
.submit:hover::before,.submit:focus-visible::before{transform:none}
.submit:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.submit:active{transform:scale(.99)}
.submit .go{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:background .35s,transform .45s cubic-bezier(.3,1.5,.5,1)}
.submit .go svg{width:20px;height:20px;fill:none;stroke:var(--teal);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .35s}
.submit:hover .go{background:var(--ink);transform:rotate(-45deg)}
.submit:hover .go svg{stroke:var(--saffron)}

.secure{margin-top:30px;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);font-weight:500}
.secure svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

@media (max-width:860px){
  .page{grid-template-columns:1fr}
  .side{min-height:46svh}
  .art{width:min(60%,300px);top:46%}
  .role h2{font-size:56px}
  h1{margin-top:36px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="page">

  <aside class="side">
    <a class="back" href="#profiles">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Back to profile selection
    </a>

    <svg class="art" viewBox="0 0 400 400" aria-hidden="true">
      <circle class="sun" cx="300" cy="100" r="56" fill="#FFE29A"/>
      <path d="M-30 300Q100 190 230 280T430 250V430H-30Z" fill="#EBA82A"/>
      <g>
        <rect x="50" y="228" width="84" height="62" fill="#FFF3D2"/>
        <path d="M38 231 92 186 146 231Z" fill="#1B1A17"/>
        <rect x="82" y="254" width="20" height="36" fill="#1B1A17"/>
        <rect x="112" y="244" width="14" height="14" fill="#EBA82A"/>
      </g>
      <g class="walker">
        <circle cx="236" cy="206" r="17" fill="#6B3E22"/>
        <path d="M219 204a17 17 0 0 1 34 0c-8-9-26-9-34 0z" fill="#1B1A17"/>
        <path d="M214 230q22-12 44 0l14 110h-72z" fill="#0B4F4A"/>
        <path d="M214 230q22-12 44 0l-6 22-38 20z" fill="#FFF3D2"/>
        <path d="M254 238 270 264" stroke="#1B1A17" stroke-width="4" stroke-linecap="round"/>
        <rect x="262" y="262" width="36" height="30" rx="5" fill="#1B1A17"/>
        <path d="M280 269v16M272 277h16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      </g>
      <path d="M-30 345Q140 285 430 335V430H-30Z" fill="#D18E17"/>
    </svg>

    <div class="role">
      <h2>ASHA<br>Worker</h2>
      <p>Community health coordination</p>
    </div>
  </aside>

  <main class="main">
    <div class="form-wrap">
      <div class="brand">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect width="48" height="48" rx="13" fill="#1B1A17"/>
          <path d="M7 26h9l4-11 6 19 4-13 2 5h9" fill="none" stroke="#F4B63F" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        SynCura AI
      </div>

      <h1>Sign in</h1>
      <p class="lead">Use your ASHA Worker account to continue.</p>

      <form onsubmit="return false">
        <div class="field">
          <label for="u">Username</label>
          <div class="control"><input id="u" type="text" autocomplete="username" placeholder="Enter your username"></div>
        </div>
        <div class="field">
          <label for="p">Password</label>
          <div class="control pw">
            <input id="p" type="password" autocomplete="current-password" placeholder="Enter your password">
            <button class="eye" type="button" aria-label="Show password" aria-pressed="false"
              onclick="const i=document.getElementById('p'),s=i.type==='password';i.type=s?'text':'password';this.setAttribute('aria-pressed',s)">
              <svg class="on" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.4 6.4A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4.2-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
        </div>
        <button class="submit" type="submit">Sign in
          <span class="go"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
      </form>

      <p class="secure">
        <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Secure, role-based sign-in
      </p>
    </div>
  </main>

</div>
</body>
</html>
